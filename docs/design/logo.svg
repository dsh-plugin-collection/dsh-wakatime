<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="dsh-wakatime logo">
  <defs>
    <!-- Free-form circular emblem: no square frame.
         TL field = DSH/DeepSeek indigo, BR field = WakaTime steel blue.
         Hard-stop diagonal split gives an anti-diagonal seam through the circle. -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"    stop-color="#5871FF"/>
      <stop offset="49.9%" stop-color="#4053E8"/>
      <stop offset="50.1%" stop-color="#5E8AB2"/>
      <stop offset="100%"  stop-color="#395573"/>
    </linearGradient>
    <!-- subtle top highlight on the disc -->
    <radialGradient id="sheen" cx="35%" cy="22%" r="80%">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="disc">
      <circle cx="256" cy="256" r="240"/>
    </clipPath>
  </defs>

  <!-- circular badge -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="240" fill="url(#sheen)"/>

  <!-- soft heartbeat bridge: a mint pulse arc flowing from DSH into WakaTime,
       replacing the rigid straight seam with an organic "data flowing" line -->
  <path d="M 285 200 C 330 235 305 295 248 322"
        fill="none" stroke="#A6F4CF" stroke-width="10"
        stroke-linecap="round" stroke-opacity=".55"/>

