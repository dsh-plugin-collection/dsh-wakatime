<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="dsh-wakatime logo">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2EA9F5"/>
      <stop offset="100%" stop-color="#4F71F0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- rounded badge -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="240" rx="110" fill="url(#sheen)"/>

  <!-- stopwatch crown -->
  <rect x="232" y="72" width="48" height="52" rx="14" fill="#ffffff"/>
  <!-- stopwatch side button -->
  <rect x="352" y="118" width="78" height="30" rx="15" fill="#ffffff" transform="rotate(-38 391 133)"/>

  <!-- watch face -->
  <circle cx="256" cy="300" r="152" fill="#ffffff" fill-opacity=".10"/>
  <circle cx="256" cy="300" r="152" fill="none" stroke="#ffffff" stroke-width="26"/>
  <!-- 12 o'clock tick -->
  <line x1="256" y1="164" x2="256" y2="192" stroke="#ffffff" stroke-width="18" stroke-linecap="round"/>

  <!-- W-shaped pulse across the dial (nod to WakaTime) -->
  <polyline points="150,258 198,344 256,272 314,344 362,258"
            fill="none" stroke="#A6F4CF" stroke-width="22"
            stroke-linecap="round" stroke-linejoin="round"/>
  <!-- pulse terminal dot, like a live heartbeat marker -->
  <circle cx="374" cy="242" r="13" fill="#A6F4CF"/>
</svg>
