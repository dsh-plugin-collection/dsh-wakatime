- insert:
    - id: dsh-wakatime-plugin
      name: 'dsh-wakatime-plugin'
      # 订正（11-10）：这里此前写的注释把「插件收到 api_key 是对象」归因于
      # `!!js` 在 bundle 层不被求值，那是误判。真实机制是：字段标了 `.volatile()`，
      # cosmokit 就以 `Object.freeze({ get, [write] })` 的 ref 对象交给 apply()，
      # 0.2.1 与 0.2.2 两代宿主都如此。插件侧的解包与逐类型校验见 src/config-value.ts。
      config:
        api_key: !!js process.env.WAKATIME_API_KEY || ''
        api_url: !!js process.env.WAKATIME_API_URL || 'https://wakatime.com'
        # 留空＝沿用 HTTPS_PROXY 环境变量 → ~/.wakatime.cfg 的 proxy。
        # 填 URL 则最优先；填 none 强制直连。
        proxy_url: ''
        no_proxy: ''
        heartbeat_interval_ms: 120000
        project_name: ''
        language: ''
        app_entity: Terminal
        include_tool_calls: true
        include_user_messages: false
        include_assistant_messages: false
        cache_heartbeats: true
        cache_limit: 100
        debug: false
